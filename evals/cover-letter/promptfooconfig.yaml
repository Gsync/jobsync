description: Cover letter prompt regression tests

providers:
  - id: openai:chat:deepseek-v4-flash
    config:
      apiBaseUrl: https://api.deepseek.com
      apiKeyEnvar: DEEPSEEK_API_KEY
      showThinking: false
      temperature: 0
      max_tokens: 8192

prompts:
  - file://./prompt.ts

# The letter is generated at a creative temperature in the app (TEMPERATURES.
# FEEDBACK), but evals run at 0 for repeatability — same trade-off as the other
# markdown prompts here.
tests:
  - description: Backend resume vs backend JD - no prior match guidance
    vars:
      resumeText: file://../job-match/fixtures/backend-resume.txt
      jobDescription: file://../job-match/fixtures/backend-job.txt
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJsonOrFenced
      - type: javascript
        value: file://./assertions.ts:assertStartsWithSalutation
      - type: javascript
        value: file://./assertions.ts:assertSignOff
      - type: javascript
        value: file://./assertions.ts:assertCandidateNameSignature
      - type: javascript
        value: file://./assertions.ts:assertWordCount
      - type: javascript
        value: file://./assertions.ts:assertNoPlaceholders
      - type: javascript
        value: file://./assertions.ts:assertNoInventedNumbers
      # Letter must engage the JD's actual must-haves, not generic enthusiasm.
      - type: icontains-any
        value:
          - "Kubernetes"
          - "Go"
          - "AWS"
      - type: llm-rubric
        provider:
          id: openai:chat:deepseek-v4-flash
          config:
            apiBaseUrl: https://api.deepseek.com
            apiKeyEnvar: DEEPSEEK_API_KEY
            temperature: 0
        value: >-
          Every employer, job title, date, degree, certification, and metric in
          the letter must appear in the candidate's resume below. Fail if the
          letter names any employer, title, school, degree, or certification the
          resume does not contain, or states an achievement the resume does not
          support. Company names taken from the job posting are acceptable when
          used as the employer being applied to. Resume:

          {{resumeText}}

  - description: Backend resume vs backend JD - with saved match guidance
    vars:
      resumeText: file://../job-match/fixtures/backend-resume.txt
      jobDescription: file://../job-match/fixtures/backend-job.txt
      guidance: file://./fixtures/match-guidance.txt
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJsonOrFenced
      - type: javascript
        value: file://./assertions.ts:assertStartsWithSalutation
      - type: javascript
        value: file://./assertions.ts:assertSignOff
      - type: javascript
        value: file://./assertions.ts:assertCandidateNameSignature
      - type: javascript
        value: file://./assertions.ts:assertWordCount
      - type: javascript
        value: file://./assertions.ts:assertNoPlaceholders
      - type: javascript
        value: file://./assertions.ts:assertNoInventedNumbers
      # The guidance block is the only untested branch of
      # buildCoverLetterPrompt: its Tailoring Tips must actually land.
      - type: icontains
        value: "Meridian Technologies"
      - type: icontains-any
        value:
          - "95K"
          - "95,000"
          - "documents per second"
          - "documents/second"
