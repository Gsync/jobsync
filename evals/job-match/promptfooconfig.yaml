description: Job match prompt regression tests

providers:
  - id: openai:chat:deepseek-v4-flash
    label: deepseek-v4-flash
    config:
      apiBaseUrl: https://api.deepseek.com
      apiKeyEnvar: DEEPSEEK_API_KEY
      showThinking: false
      temperature: 0
      max_tokens: 8192

  - id: ollama:chat:qwen3.5:9b
    label: ollama-qwen3.5-9b
    config:
      temperature: 0
      think: false
      num_ctx: 16384
      num_predict: 8192

  # Any OpenAI-compatible local server (oMLX, LM Studio, ...). Run with
  # --openai-compatible to use it in place of Ollama.
  - id: openai:chat:{{ env.EVAL_OPENAI_COMPATIBLE_MODEL | default('Qwen3.5-9B-MLX-4bit') }}
    label: openai-compatible
    config:
      apiBaseUrl: "{{ env.EVAL_OPENAI_COMPATIBLE_BASE_URL | default('http://localhost:8000/v1') }}"
      apiKey: none
      # Same as the app's openaiCompatible providerOptions for this surface
      passthrough:
        chat_template_kwargs:
          enable_thinking: false
      temperature: 0
      max_tokens: 8192

prompts:
  - file://./prompt.ts

tests:
  - description: Backend resume vs matching backend JD - strong fit
    vars:
      resumeText: file://./fixtures/backend-resume.txt
      jobDescription: file://./fixtures/backend-job.txt
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJson
      - type: javascript
        value: file://./assertions.ts:assertScoresLine
      - type: javascript
        value: file://./assertions.ts:assertScoresFirstLine
      - type: javascript
        value: file://./assertions.ts:assertMarkdownBodyNonEmpty
      - type: javascript
        value: file://./assertions.ts:assertRequiredSections
      - type: javascript
        value: file://./assertions.ts:assertRecommendationConsistent
      - type: javascript
        value: file://./assertions.ts:assertStrongMatchHigh

  - description: Marketing resume vs backend JD - weak fit
    vars:
      resumeText: file://./fixtures/marketing-resume.txt
      jobDescription: file://./fixtures/backend-job.txt
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJson
      - type: javascript
        value: file://./assertions.ts:assertScoresLine
      - type: javascript
        value: file://./assertions.ts:assertScoresFirstLine
      - type: javascript
        value: file://./assertions.ts:assertMarkdownBodyNonEmpty
      - type: javascript
        value: file://./assertions.ts:assertRequiredSections
      - type: javascript
        value: file://./assertions.ts:assertRecommendationConsistent
      - type: javascript
        value: file://./assertions.ts:assertWeakMatchLow
      # Analysis must call out the missing backend must-haves by name.
      - type: icontains-any
        value:
          - "Go"
          - "Kubernetes"
          - "AWS"
