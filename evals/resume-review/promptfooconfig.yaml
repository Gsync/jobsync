description: Resume review prompt regression tests

# temperature 0.3 matches TEMPERATURES.FEEDBACK, which review_resume sends.
providers:
  - id: openai:chat:deepseek-v4-flash
    label: deepseek-v4-flash
    config:
      apiBaseUrl: https://api.deepseek.com
      apiKeyEnvar: DEEPSEEK_API_KEY
      showThinking: false
      temperature: 0.3
      max_tokens: 8192

  - id: ollama:chat:qwen3.5:9b
    label: ollama-qwen3.5-9b
    config:
      temperature: 0.3
      think: false
      num_ctx: 16384
      num_predict: 8192

  # Any OpenAI-compatible local server (oMLX, LM Studio, ...). Run with
  # --openai-compatible to use it in place of Ollama.
  - id: openai:chat:{{ env.EVAL_OPENAI_COMPATIBLE_MODEL | default('Qwen3.5-9B-MLX-4bit') }}
    label: openai-compatible
    config:
      apiBaseUrl: "{{ env.EVAL_OPENAI_COMPATIBLE_BASE_URL | default('http://localhost:8000/v1') }}"
      apiKey: none
      # Same as the app's openaiCompatible providerOptions for this surface
      passthrough:
        chat_template_kwargs:
          enable_thinking: false
      temperature: 0.3
      max_tokens: 8192

prompts:
  - file://./prompt.ts

tests:
  - description: Strong senior engineer resume - structural + score validation
    vars:
      resumeText: file://./fixtures/strong-senior.txt
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJson
      - type: javascript
        value: file://./assertions.ts:assertScoresLine
      - type: javascript
        value: file://./assertions.ts:assertScoresFirstLine
      - type: javascript
        value: file://./assertions.ts:assertMarkdownBodyNonEmpty
      - type: javascript
        value: file://./assertions.ts:assertRequiredSections
      - type: javascript
        value: file://./assertions.ts:assertStrongScoresHigh

  - description: Weak/sparse resume - structural + score + content validation
    vars:
      resumeText: file://./fixtures/weak-sparse.txt
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJson
      - type: javascript
        value: file://./assertions.ts:assertScoresLine
      - type: javascript
        value: file://./assertions.ts:assertScoresFirstLine
      - type: javascript
        value: file://./assertions.ts:assertMarkdownBodyNonEmpty
      - type: javascript
        value: file://./assertions.ts:assertRequiredSections
      - type: javascript
        value: file://./assertions.ts:assertWeakScoresLow
      # Review must reference the fixture's weak phrasing, not paraphrase it away.
      - type: icontains-any
        value:
          - "Responsible for"
          - "Helped with"

  - description: Recent dates resume - past dates must not be called future (issue #123)
    vars:
      resumeText: file://./fixtures/recent-dates.ts
    assert:
      - type: javascript
        value: file://./assertions.ts:assertNotJson
      - type: javascript
        value: file://./assertions.ts:assertScoresLine
      - type: javascript
        value: file://./assertions.ts:assertRequiredSections
      - type: javascript
        value: file://./assertions.ts:assertNoFutureDateClaim
